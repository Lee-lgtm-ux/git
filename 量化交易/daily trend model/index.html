<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日频股价走势判断平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="控制区">
        <div class="brand">
          <div class="brand-mark">T</div>
          <div>
            <h1>日频走势判断</h1>
            <p>未来 1/3/5 日上涨概率与趋势评分。</p>
          </div>
        </div>

        <div class="control-group">
          <h2>模型输出</h2>
          <label class="file-drop" for="scoreFile">
            <input id="scoreFile" type="file" accept=".csv,text/csv" />
            <span>导入 latest_daily_trend_scores.csv</span>
            <small id="scoreFileName">默认读取本地输出，失败时使用示例。</small>
          </label>
          <label class="file-drop" for="metricFile">
            <input id="metricFile" type="file" accept=".json,application/json" />
            <span>导入 metrics.json</span>
            <small id="metricFileName">可选，用于显示模型验证摘要。</small>
          </label>
        </div>

        <div class="control-group">
          <h2>筛选</h2>
          <label>
            搜索股票代码
            <input id="searchInput" type="search" placeholder="例如 sh600519" />
          </label>
          <label>
            评级
            <select id="ratingFilter">
              <option value="">全部评级</option>
              <option value="强">强</option>
              <option value="偏强">偏强</option>
              <option value="中性">中性</option>
              <option value="偏弱">偏弱</option>
              <option value="弱">弱</option>
            </select>
          </label>
          <label>
            最低趋势分
            <input id="minScore" type="range" min="0" max="100" value="0" />
            <span id="minScoreText">0</span>
          </label>
        </div>

        <div class="control-group">
          <h2>排序</h2>
          <div class="segmented" role="group" aria-label="排序字段">
            <button class="active" data-sort="trend_score" type="button">趋势分</button>
            <button data-sort="prob_up_5d" type="button">5日概率</button>
            <button data-sort="pred_return_5d" type="button">5日收益</button>
          </div>
        </div>

        <button id="resetBtn" class="secondary-action" type="button">重置视图</button>
      </aside>

      <section class="content">
        <header class="toolbar">
          <div>
            <p class="eyebrow">Daily Price Trend Model</p>
            <h2 id="pageTitle">等待模型结果</h2>
          </div>
          <button id="exportBtn" class="primary-action" type="button">导出当前列表</button>
        </header>

        <section id="metricCards" class="metrics-grid" aria-label="核心指标"></section>

        <section class="main-grid">
          <section class="panel table-panel">
            <div class="panel-header">
              <div>
                <h3>最新趋势评分</h3>
                <p id="tableSubtitle">按趋势分排序；这不是买卖建议。</p>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>排名</th>
                    <th>代码</th>
                    <th>日期</th>
                    <th>评级</th>
                    <th>趋势分</th>
                    <th>1日上涨</th>
                    <th>3日上涨</th>
                    <th>5日上涨</th>
                    <th>5日预期</th>
                    <th>置信度</th>
                  </tr>
                </thead>
                <tbody id="scoreBody"></tbody>
              </table>
            </div>
          </section>

          <aside class="panel detail-panel">
            <div class="panel-header">
              <div>
                <h3 id="detailTitle">选择一只股票</h3>
                <p id="detailSubtitle">查看模型拆解。</p>
              </div>
            </div>
            <div id="detailContent" class="detail-content"></div>
          </aside>
        </section>

        <section class="panel">
          <div class="panel-header">
            <div>
              <h3>模型验证摘要</h3>
              <p id="metricsSubtitle">训练脚本生成的 out-of-sample 指标。</p>
            </div>
          </div>
          <div id="validationGrid" class="validation-grid"></div>
        </section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
